<!doctype html>
<html><head><meta charset="utf-8"><title>Shorts stand-in (Space)</title><link rel="icon" href="data:,">
<style>
  body { margin: 0; background: #0f0f0f; color: #f1f1f1; font: 14px Roboto, Arial, sans-serif; }
  #search { position: fixed; top: 10px; left: 10px; width: 300px; }
  #like { position: fixed; top: 10px; left: 330px; }
  #shorts-inner-container { margin: 60px 0 0 40px; height: 420px; width: 260px; overflow-y: auto; scroll-snap-type: y mandatory; }
  #shorts-inner-container > * { height: 420px; scroll-snap-align: start; display: block; background: #222; }
  video { width: 240px; height: 400px; background: #333; display: block; }
</style>
</head>
<body>
<!-- A stand-in for a YouTube Short (tests/e2e/youtube.mjs), for Space. As YouTube's Shorts do, it plays and
     pauses on Space only while its player has the keyboard (otherwise Space lands on the page, which can't
     scroll: nothing happens), and on K from anywhere. A search box and a button, whose Space is theirs. -->
<input id="search" placeholder="Search">
<button id="like" onclick="window.__likes = (window.__likes || 0) + 1">Like</button>
<ytd-shorts>
  <div id="shorts-inner-container">
    <div class="reel-video-in-sequence-new style-scope ytd-shorts" id="reel-0"><ytd-reel-video-renderer class="style-scope ytd-shorts" is-active=""><div id="shorts-player" class="html5-video-player" tabindex="-1"><video id="sv" loop muted playsinline></video></div></ytd-reel-video-renderer></div>
    <div class="reel-video-in-sequence-new style-scope ytd-shorts" id="reel-1"><ytd-reel-video-renderer class="style-scope ytd-shorts">The next Short</ytd-reel-video-renderer></div>
  </div>
</ytd-shorts>
<script>
  // Seconds of silence as a WAV, so the <video> has something to play.
  const wav = (secs) => {
    const rate = 8000, n = rate * secs, buf = new ArrayBuffer(44 + n), d = new DataView(buf);
    const w = (o, s) => [...s].forEach((c, i) => d.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); d.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
    d.setUint32(24, rate, true); d.setUint32(28, rate, true); d.setUint16(32, 1, true); d.setUint16(34, 8, true); w(36, 'data'); d.setUint32(40, n, true);
    for (let i = 0; i < n; i++) d.setUint8(44 + i, 128);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  };
  const v = document.getElementById('sv'), player = document.getElementById('shorts-player');
  v.src = wav(60);
  v.play().catch(() => {});
  window.__toggles = 0;
  const toggle = () => { window.__toggles++; if (v.paused) v.play(); else v.pause(); };
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && document.activeElement === player) { e.preventDefault(); toggle(); }
    if (e.key === 'k' && !(e.target.closest && e.target.closest('input, textarea'))) toggle();
  });
</script>
</body></html>
