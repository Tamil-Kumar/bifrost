<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors</title><link rel="icon" href="icons/red.png">
<style>
  /* Strong colors and text behind where menus open, so see-through menus show it. */
  body { margin: 0; font: 700 28px/1.2 system-ui, sans-serif; color: #fff; }
  .band { height: 120px; display: flex; align-items: center; padding: 0 40px; }
  .b1 { background: linear-gradient(90deg, #ff3d6e, #ffb13d); } .b2 { background: linear-gradient(90deg, #2bd47c, #2b9cd4); }
  .b3 { background: linear-gradient(90deg, #7a3dff, #ff3dc8); } .b4 { background: linear-gradient(90deg, #ffe03d, #3dff8a); color: #222; }
  .b5 { background: repeating-linear-gradient(45deg, #222 0 20px, #eee 20px 40px); color: #f0f; }
  .b6 { background: #fff; color: #111; } .b7 { background: #111; }
</style></head>
<body>
<div class="band b1">Sunset gradient — LOREM IPSUM DOLOR</div><div class="band b2">Ocean gradient — THE QUICK BROWN FOX</div>
<div class="band b3">Violet gradient — JUMPS OVER THE LAZY DOG</div><div class="band b4">Lime gradient — 0123456789</div>
<div class="band b5">Stripes — SEE-THROUGH TEST</div><div class="band b6">White band with dark text</div><div class="band b7">Black band with white text</div>
</body></html>
