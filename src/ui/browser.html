<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bifrost</title>
  <!-- All the window is made of, asked for at once as it opens, rather than each file after the one that names
       it (the modules js/main.js imports, however deep: tests/unit/ui-preload.test.mjs keeps the list true). -->
  <link rel="preload" as="style" href="/_/common/base.css">
  <link rel="modulepreload" href="/js/ambient.js">
  <link rel="modulepreload" href="/js/appmenu.js">
  <link rel="modulepreload" href="/js/bookmarks.js">
  <link rel="modulepreload" href="/js/commands.js">
  <link rel="modulepreload" href="/js/contextmenu.js">
  <link rel="modulepreload" href="/js/downloads.js">
  <link rel="modulepreload" href="/js/extensions.js">
  <link rel="modulepreload" href="/js/flyouts.js">
  <link rel="modulepreload" href="/js/siteinfo.js">
  <link rel="modulepreload" href="/js/swipe.js">
  <link rel="modulepreload" href="/js/theme.js">
  <link rel="modulepreload" href="/js/workspaces.js">
  <link rel="modulepreload" href="/js/findbar.js">
  <link rel="modulepreload" href="/js/launcher.js">
  <link rel="modulepreload" href="/js/panels.js">
  <link rel="modulepreload" href="/js/tabstrip.js">
  <link rel="modulepreload" href="/js/tabswitch.js">
  <link rel="modulepreload" href="/js/toolbar.js">
  <link rel="modulepreload" href="/_/common/dialogs.js">
  <link rel="modulepreload" href="/_/common/menus.js">
  <link rel="modulepreload" href="/_/common/translate.js">
  <link rel="modulepreload" href="/js/omnibox.js">
  <link rel="modulepreload" href="/js/prompts.js">
  <link rel="modulepreload" href="/js/views.js">
  <link rel="modulepreload" href="/_/common/icons.js">
  <link rel="modulepreload" href="/_/common/util.js">
  <link rel="modulepreload" href="/js/menus.js">
  <link rel="modulepreload" href="/js/results.js">
  <link rel="modulepreload" href="/js/icons.js">
  <link rel="modulepreload" href="/js/state.js">
  <link rel="modulepreload" href="/js/tabs.js">
  <link rel="modulepreload" href="/js/util.js">
  <link rel="stylesheet" href="browser.css">
  <script src="/_/shared/themes.js"></script>
  <script src="/_/shared/defaults.js"></script>
  <script src="/_/shared/launcher-settings.js"></script>
  <script src="/_/shared/engine.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Tabs">
      <div id="sidebar-top" class="drag"></div>
      <div id="sidebar-nav"></div>
      <div id="pinned" role="tablist" aria-label="Pinned tabs"></div>
      <div id="tablist-wrap">
        <div id="tablist" role="tablist" aria-label="Tabs"></div>
      </div>
      <div id="sidebar-panels" class="empty" aria-label="Side panels"></div>
      <div id="sidebar-bottom"></div>
      <div id="sidebar-resizer" title="Drag to resize"></div>
    </aside>
    <nav id="panel-strip" class="drag" aria-label="Side bar"></nav>
    <section id="panel" aria-label="Side panel"></section>
    <main id="content">
      <div id="top-hot" aria-hidden="true"></div>
      <div id="topbar">
        <div id="hbar" class="drag"></div>
        <div id="toolbar" class="drag"></div>
        <div id="bookmarks-bar" role="toolbar" aria-label="Bookmarks bar"></div>
      </div>
      <div id="infobars"></div>
      <div id="stage">
        <div id="views"></div>
        <div id="panes"></div>
        <div id="stage-ui"></div>
      </div>
    </main>
  </div>
  <div id="edge-hot"></div>
  <div id="overlay-root"></div>
</body>
</html>
