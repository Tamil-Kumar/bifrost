# Scratch checks (this branch only, not for main): the VPN helper as it'll ship, its tests on Linux and Windows,
# and its speed through Cloudflare WARP against main's.
name: Checks

on:
  push:
    branches: ['checks/**']
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/vpn/go.mod
          cache: false
      - name: Go tests
        working-directory: tools/vpn
        run: |
          go build -mod=readonly -o /dev/null . && go vet ./...
          go test -mod=readonly -count=1 -v ./... 2>&1 | grep -E '^(--- |ok|FAIL|PASS)'
          go test -mod=readonly -race -count=1 ./...
          go test -mod=readonly -run XXX -bench . -benchtime 3x ./netstack

  bench:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/vpn/go.mod
          cache: false
      - name: Electron runtime (cached)
        uses: actions/cache@v4
        with:
          path: ~/cache
          key: electron-${{ hashFiles('package.json') }}
          restore-keys: electron-
      - name: VPN helper, as the release builds it, and main's
        shell: bash
        working-directory: tools/vpn
        run: |
          go vet ./... && go test -count=1 ./...
          for a in amd64:x64 arm64:arm64; do
            GOOS=windows GOARCH=${a%%:*} CGO_ENABLED=0 go build -mod=readonly -trimpath -ldflags "-s -w -X main.version=check" -o ../../assets/bin/bifrost-vpn-${a##*:}.exe .
          done
          git fetch -q --depth 1 origin main && mkdir -p ../../old && git -C ../.. archive FETCH_HEAD tools/vpn | tar -x -C ../../old
          (cd ../../old/tools/vpn && CGO_ENABLED=0 go build -mod=readonly -trimpath -ldflags "-s -w -X main.version=main" -o ../../../old.exe .)
          ls -la ../../assets/bin ../../old.exe
      - name: VPN through Cloudflare WARP
        shell: bash
        run: node tools/vpn/check.mjs assets/bin/bifrost-vpn-x64.exe
      - name: The VPN in Bifrost
        if: always()
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright-core@1.63.0
          node tools/vpn/bifrost-check.mjs
      - name: Speed through Cloudflare WARP, main's helper and this one
        if: always()
        shell: bash
        run: node tools/vpn/bench.mjs 3 main=old.exe new=assets/bin/bifrost-vpn-x64.exe
