# Scratch checks (this branch only, not for main): the VPN helper as it'll ship, its tests on Linux and Windows,
# and its speed through Cloudflare WARP against main's.
name: Checks

on:
  push:
    branches: ['checks/**']
  workflow_dispatch:

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/vpn/go.mod
          cache: false
      - name: Electron runtime (cached)
        uses: actions/cache@v4
        with:
          path: ~/cache
          key: electron-${{ hashFiles('package.json') }}
          restore-keys: electron-
      - name: VPN helper, as the release builds it, and main's
        shell: bash
        working-directory: tools/vpn
        run: |
          go vet ./... && go test -count=1 ./...
          for a in amd64:x64 arm64:arm64; do
            GOOS=windows GOARCH=${a%%:*} CGO_ENABLED=0 go build -mod=readonly -trimpath -ldflags "-s -w -X main.version=check" -o ../../assets/bin/bifrost-vpn-${a##*:}.exe .
          done
          git fetch -q --depth 1 origin 140a8973bc3fe0033587b8832a1b23f1fcc421dc && mkdir -p ../../old && git -C ../.. archive FETCH_HEAD tools/vpn | tar -x -C ../../old
          (cd ../../old/tools/vpn && CGO_ENABLED=0 go build -mod=readonly -trimpath -ldflags "-s -w -X main.version=main" -o ../../../old.exe .)
          ls -la ../../assets/bin ../../old.exe
      - name: The helper check, again and again, this one and main's in turn
        shell: bash
        run: |
          for i in 1 2 3 4; do
            for x in assets/bin/bifrost-vpn-x64.exe old.exe; do
              echo "==== $i $x"
              node tools/vpn/check.mjs $x 2>&1 | grep -E "ports:|25 MB|✓|✗" || true
            done
          done
