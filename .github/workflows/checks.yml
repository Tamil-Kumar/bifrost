# Scratch checks (this branch only, not for main): the VPN helper's speed against Cloudflare WARP, and the Go
# modules it's built from, for building it elsewhere.
name: Checks

on:
  push:
    branches: ['checks/**']
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/vpn/go.mod
          cache: false
      - name: Go tests
        working-directory: tools/vpn
        run: |
          go build -mod=readonly -o /dev/null . && go vet ./...
          go test -mod=readonly -v -count=1 ./... 2>&1 | grep -v '^=== RUN' | tail -40
          go test -mod=readonly -count=1 ./... > /dev/null
      - name: Go tests with the race detector
        working-directory: tools/vpn
        run: go test -mod=readonly -race -count=1 ./netstack
      - name: Through the stack, how fast
        working-directory: tools/vpn
        run: go test -mod=readonly -run XXX -bench . -benchtime 3x ./netstack

  bench:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/vpn/go.mod
          cache: false
      - name: VPN helper
        shell: bash
        working-directory: tools/vpn
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -mod=readonly -trimpath -ldflags "-s -w -X main.version=bench" -o ../../assets/bin/bifrost-vpn-x64.exe .
      - name: Where the processor goes
        shell: bash
        run: |
          X=assets/bin/bifrost-vpn-x64.exe
          node tools/vpn/bench.mjs profile 16 stock=$X:BIFROST_VPN_EXP=stock rbfast=$X:BIFROST_VPN_EXP=riobatch+batch+copy+dns+happy
          for v in stock rbfast; do
            echo "==== $v: working (not waiting)"; go tool pprof -top -nodecount=40 -ignore='GetQueuedCompletionStatus|syscall.readFile|runtime.netpoll' "$TEMP/bifrost-vpn-$v.prof"
          done
      - name: Speed through Cloudflare WARP
        shell: bash
        run: |
          X=assets/bin/bifrost-vpn-x64.exe
          F=riobatch+batch+copy+dns+happy
          node tools/vpn/bench.mjs 3 stock=$X:BIFROST_VPN_EXP=stock std=$X:BIFROST_VPN_EXP=stock+std riobatch=$X:BIFROST_VPN_EXP=stock+riobatch rx1024=$X:BIFROST_VPN_EXP=stock+riobatch+rx=1024+sockbuf=0 rbfast=$X:BIFROST_VPN_EXP=$F rbup=$X:BIFROST_VPN_EXP=$F+norack rball=$X:BIFROST_VPN_EXP=$F+norack+buf8
