# Builds Bifrost for Windows (x64 and ARM64) on castlabs' Electron, which has Widevine; signs it for Widevine
# with the castlabs EVS account in this repository's secrets (EVS_ACCOUNT_NAME, EVS_PASSWD), so streaming
# services like Netflix play; checks that protected video plays and that files opened with Bifrost open in it;
# and publishes the release, whose latest.json is what Bifrost's updater reads.
# Runs when main gets a version (package.json) that has no release yet, when a version tag (v1.2.3, matching
# package.json) is pushed, or by hand (Actions → Release → Run workflow) for the version in package.json.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Is there something to release? (A push to main without a new version isn't.)
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $v"; exit 1
          fi
          release=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ] && gh release view "v$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            release=false
            echo "Bifrost $v is released already: nothing to do"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # (the VPN helper: Go, at the version tools/vpn/go.mod names)
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/vpn/go.mod
          cache: false

      - name: Version
        shell: bash
        run: |
          echo "VERSION=${{ needs.check.outputs.version }}" >> "$GITHUB_ENV"
          if [ -z "$EVS_ACCOUNT_NAME" ] || [ -z "$EVS_PASSWD" ]; then
            echo "::warning::No castlabs EVS account in the secrets (EVS_ACCOUNT_NAME, EVS_PASSWD): this build isn't signed for Widevine, so Netflix and some other services won't play"
          fi

      # (tools/release.mjs keeps its downloads in ~/cache too)
      - name: Electron runtime (cached)
        uses: actions/cache@v4
        with:
          path: ~/cache
          key: electron-${{ hashFiles('package.json') }}
          restore-keys: electron-

      - name: castlabs EVS
        if: env.EVS_ACCOUNT_NAME != '' && env.EVS_PASSWD != ''
        run: python -m pip install --upgrade castlabs-evs

      # Bifrost's VPN helper (tools/vpn: WireGuard in user space, and a SOCKS5 proxy into it), for each build, from
      # exactly the libraries go.sum names; into assets/bin, where the build takes it from.
      - name: VPN helper
        shell: bash
        working-directory: tools/vpn
        run: |
          go vet ./... && go test ./...
          for a in amd64:x64 arm64:arm64; do
            GOOS=windows GOARCH=${a%%:*} CGO_ENABLED=0 go build -mod=readonly -trimpath -ldflags "-s -w -X main.version=$VERSION" -o ../../assets/bin/bifrost-vpn-${a##*:}.exe .
          done
          ls -la ../../assets/bin

      - name: Build
        shell: bash
        run: node tools/release.mjs --out=dist/release --notes=RELEASE_NOTES.md --notes-out=dist/notes.md ${EVS_ACCOUNT_NAME:+${EVS_PASSWD:+--sign}}

      # (Only a signed build has to pass: Google's test license server may refuse an unsigned one.)
      - name: Protected video plays
        continue-on-error: ${{ env.EVS_ACCOUNT_NAME == '' || env.EVS_PASSWD == '' }}
        run: node tools/drm-check.mjs dist/release --timeout=240

      # (Doesn't hold up a release: what it finds is in the log.)
      - name: Notifications reach Windows
        continue-on-error: true
        run: node tools/notify-check.mjs dist/release --timeout=120

      # A file opened with Bifrost (a PDF from Explorer, say) and a link from another app open in it, whether
      # it's running or not: Windows' own way in (ShellExecuteEx, Bifrost's command), a path with spaces.
      - name: Files open in Bifrost
        run: node tools/open-check.mjs dist/release --timeout=90

      # The VPN helper against the real Cloudflare WARP: signs up, connects, Cloudflare's trace page says warp=on
      # through it, and a download through it and straight (tools/vpn/check.mjs). Doesn't hold up a release:
      # Cloudflare may turn sign-ups from GitHub's machines away now and then.
      - name: VPN through Cloudflare WARP
        continue-on-error: true
        shell: bash
        run: node tools/vpn/check.mjs assets/bin/bifrost-vpn-x64.exe

      # The same in Bifrost itself: turned on, a tab's page through WARP, WebRTC only through it, off again
      # (tools/vpn/bifrost-check.mjs). And the builds have their helpers: each installer's own, the update both.
      - name: The VPN in Bifrost
        continue-on-error: true
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright-core@1.63.0
          node tools/vpn/bifrost-check.mjs
          node -e "const b = require('fs').readFileSync(process.argv[1]).toString('latin1'); const ok = ['x64', 'arm64'].every((a) => new RegExp('assets[\\\\/]bin[\\\\/]bifrost-vpn-' + a + '\\\\.exe').test(b)); console.log('[vpn-in-bifrost] ' + (ok ? '✓ the update has both helpers' : '✗ the update lacks a helper')); process.exit(ok ? 0 : 1)" "dist/release/Bifrost-$VERSION-app.zip"

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            gh release create "$tag" dist/release/* --target "$GITHUB_SHA" --title "Bifrost $VERSION" --notes-file dist/notes.md --latest
          fi
